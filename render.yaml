# Deploy on Render for full YouTube + Speechmatics (yt-dlp in Docker).
# One-click: https://render.com/deploy?repo=https://github.com/voteforwaldo/transciber-web
services:
  - type: web
    name: transciber-web
    runtime: docker
    plan: free
    branch: master
    healthCheckPath: /api/status
    envVars:
      - key: SPEECHMATICS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YTDLP_COOKIES
        sync: false
      - key: NODE_ENV
        value: production
